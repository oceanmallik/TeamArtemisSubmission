<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS Health Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    #offline-badge {
      display: inline-flex;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      background-color: rgba(92, 225, 230, 0.1);
      border-radius: 9999px;
      padding: 4px 10px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <header>
    AEGIS
    <select id="crew-select" aria-label="Crew member"></select>
    <span id="offline-badge" class="offline-badge" style="display: none; margin-left: auto; margin-right: 8px;">Offline ready</span>
    <span id="link-badge">Connected</span>
  </header>
  <main id="app">
    <section id="indicators">
      <div class="panel">
        <h2>Heart rate</h2>
        <div id="chart-hr"></div>
      </div>
      <div class="panel">
        <h2>Blood pressure</h2>
        <div id="chart-bp"></div>
      </div>
      <div class="panel">
        <h2>Glucose</h2>
        <div id="chart-glucose"></div>
      </div>
      <div class="panel">
        <h2>Temperature</h2>
        <div id="chart-temp"></div>
      </div>
      <div class="panel">
        <h2>Sleep</h2>
        <div id="chart-sleep"></div>
      </div>
      <div class="panel">
        <h2>Mood</h2>
        <div id="chart-mood"></div>
      </div>
      <div class="panel">
        <h2>Activity</h2>
        <div id="chart-activity"></div>
      </div>
    </section>
    <section id="alerts" class="panel">
      <h2>Alerts</h2>
      <div id="alert-list"></div>
    </section>
    <section id="decisions" class="panel">
      <h2>Decision log</h2>
      <ul id="decision-log"></ul>
    </section>
    <section id="comms" class="panel">
      <h2>Comms link</h2>
      <div id="comms-body"></div>
    </section>
    <section id="hazards" class="panel">
      <h2>Mission hazards</h2>
      <div id="hazard-list"></div>
    </section>
  </main>
  <footer>
    Simulated data. Not a medical device.
  </footer>
  <script src="js/charts.js"></script>
  <script src="js/baseline.js"></script>
  <script src="js/detect.js"></script>
  <script src="js/store.js"></script>
  <script src="js/comms.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        function showOfflineBadge() {
          const badge = document.getElementById("offline-badge");
          if (badge) {
            badge.style.display = "inline-flex";
          }
        }

        if (registration.active || navigator.serviceWorker.controller) {
          showOfflineBadge();
        }

        if (registration.installing) {
          registration.installing.addEventListener("statechange", (e) => {
            if (e.target.state === "installed" || e.target.state === "activated") {
              showOfflineBadge();
            }
          });
        }

        registration.addEventListener("updatefound", () => {
          const sw = registration.installing;
          if (sw) {
            sw.addEventListener("statechange", () => {
              if (sw.state === "installed" || sw.state === "activated") {
                showOfflineBadge();
              }
            });
          }
        });
      }).catch((err) => {
        console.error("ServiceWorker registration failed:", err);
      });

      navigator.serviceWorker.addEventListener("message", (event) => {
        if (event.data && event.data.type === "OFFLINE_READY") {
          const badge = document.getElementById("offline-badge");
          if (badge) {
            badge.style.display = "inline-flex";
          }
        }
      });
    }
  </script>
</body>
</html>
